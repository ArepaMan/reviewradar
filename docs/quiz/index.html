<title>ReviewRadar Phase 0 Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column, three views (dashboard, question, summary). The only decorative device is a git-log style session history. */
:root {
  --bg: #F1F4F5;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6A77;
  --line: #D3DBE0;
  --code-bg: #E8EDF0;
  --accent: #2742C9;
  --accent-ink: #FFFFFF;
  --good: #1B7547;
  --good-bg: #E1F2E8;
  --bad: #B3261E;
  --bad-bg: #FBE5E3;
  --warn: #9A5B00;
  --warn-bg: #FBEFD6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A;
    --surface: #151D25;
    --ink: #E6EDF2;
    --muted: #93A3B0;
    --line: #27333E;
    --code-bg: #1C2630;
    --accent: #8CA0FF;
    --accent-ink: #0E141A;
    --good: #5BD08F;
    --good-bg: #12291D;
    --bad: #FF8A80;
    --bad-bg: #33181A;
    --warn: #E8B45A;
    --warn-bg: #2E2410;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A;
  --surface: #151D25;
  --ink: #E6EDF2;
  --muted: #93A3B0;
  --line: #27333E;
  --code-bg: #1C2630;
  --accent: #8CA0FF;
  --accent-ink: #0E141A;
  --good: #5BD08F;
  --good-bg: #12291D;
  --bad: #FF8A80;
  --bad-bg: #33181A;
  --warn: #E8B45A;
  --warn-bg: #2E2410;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 56px; }
#wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre.blk { font-family: var(--mono); font-size: 0.85rem; background: var(--code-bg); padding: 10px 12px; border-radius: 6px; margin: 0; overflow-x: auto; white-space: pre; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.crumb { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.chip { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.chip.ok { color: var(--good); border-color: var(--good); }
h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.1; }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 58ch; }

.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-block: 24px; border-block: 1px solid var(--line); }
.strip > div { padding: 14px 4px 14px 0; }
.strip > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.strip .n { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.strip .n small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.strip .l { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; transition: border-color 0.15s, background 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: 0.88rem; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--code-bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sizes { margin-top: 14px; font-size: 0.88rem; color: var(--muted); }

section.block { margin-top: 36px; }
section.block > h2 { font-size: 1.15rem; margin-bottom: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin: -4px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.topic { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.topic:last-child { border-bottom: 1px solid var(--line); }
.topic .name { font-weight: 600; }
.topic .sub { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic .covers { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); margin-top: -2px; }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--line); gap: 1px; }
.bar span { display: block; min-width: 0; }
.s-learn { background: var(--warn); }
.s-solid { background: var(--accent); }
.s-master { background: var(--good); }
.bar .s-new { background: transparent; }

.log { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); font-family: var(--mono); font-size: 0.82rem; }
.log li { position: relative; padding: 6px 0 6px 16px; display: grid; grid-template-columns: 4.6em 4.8em 3.4em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.log li::before { content: ""; position: absolute; left: -22px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.log li.perfect::before { background: var(--good); border-color: var(--good); }
.log .h { color: var(--warn); }
.log .d { color: var(--muted); }
.log .t { color: var(--muted); font-family: var(--body); font-size: 0.82rem; overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); font-size: 0.92rem; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.ticks { display: flex; gap: 2px; margin-bottom: 20px; }
.ticks span { flex: 1; height: 5px; border-radius: 2px; background: var(--line); min-width: 0; }
.ticks .ok { background: var(--good); }
.ticks .no { background: var(--bad); }
.ticks .cur { background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 4vw, 26px); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tag { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pill { font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.pill.kind { background: var(--code-bg); color: var(--muted); font-family: var(--mono); font-weight: 500; }
.q { font-family: var(--display); font-weight: 600; font-size: clamp(1.1rem, 3.4vw, 1.35rem); line-height: 1.3; margin: 0 0 18px; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 14px; transition: border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); padding-top: 2px; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: 0.55; }
.opt.picked { border-color: var(--accent); background: var(--code-bg); }
.opt.picked .k { color: var(--accent); font-weight: 600; }
.cmdbox { display: flex; gap: 10px; flex-wrap: wrap; }
.cmdbox input { flex: 1 1 260px; min-width: 0; font-family: var(--mono); font-size: 0.95rem; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.cmdbox input:disabled { opacity: 0.8; }
.feedback { margin-top: 18px; border-radius: 8px; padding: 14px 16px; }
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--bad-bg); }
.feedback .v { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .v { color: var(--good); }
.feedback.no .v { color: var(--bad); }
.feedback p { margin: 4px 0 0; }
.feedback .exp { margin: 8px 0 0; display: grid; gap: 6px; }
.feedback .exp .l { font-size: 0.78rem; color: var(--muted); }
.seq { margin: 8px 0 0; padding-left: 1.4em; display: grid; gap: 4px; }
.seq li.bad::marker { color: var(--bad); font-weight: 700; }
.seq li.good::marker { color: var(--good); font-weight: 700; }
.answerbox { margin-top: 4px; border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--bg); border-radius: 0 8px 8px 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 14px; font-family: var(--mono); }

.score { font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 14vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 0.4em; color: var(--muted); }
.missed { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.missed li { border-left: 3px solid var(--bad); padding: 4px 0 4px 14px; }
.missed .mq { font-weight: 600; margin-bottom: 4px; }
.missed .ma { color: var(--muted); font-size: 0.92rem; }
.foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; align-items: baseline; }
.foot p { margin: 0; max-width: 52ch; }
.link { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 0.82rem; }
.link.danger { color: var(--bad); }

@media (max-width: 560px) {
  .topic { grid-template-columns: minmax(0, 1fr) auto; }
  .topic .bar-wrap { grid-column: 1 / -1; order: 3; }
  .topic .covers { order: 4; }
  .log li { grid-template-columns: 4.4em 3.4em minmax(0, 1fr); }
  .log .d { display: none; }
  .strip .n { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="wrap"><div id="app"></div></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Question bank. Keep ids stable: progress is stored by id.
     mc(id, topic, subtopic, question, correct, [3 wrong], explanation, hitInPhase0)
     rec(id, topic, subtopic, question, answer)               self-graded recall
     cmd(id, topic, subtopic, question, [accepted commands], explanation)   type the command
     ord(id, topic, subtopic, question, [steps in correct order], explanation)
     --------------------------------------------------------------- */
  function mc(id, t, s, q, a, w, x, m) { return { id: id, t: t, s: s, q: q, a: a, w: w, x: x || "", m: !!m }; }
  function rec(id, t, s, q, a) { return { id: id, t: t, s: s, q: q, a: a, r: true }; }
  function cmd(id, t, s, q, acc, x) { return { id: id, t: t, s: s, q: q, cmd: acc, x: x || "" }; }
  function ord(id, t, s, q, steps, x) { return { id: id, t: t, s: s, q: q, o: steps, x: x || "" }; }

  var TOPICS = [
    { k: "env", n: "Python environments & uv" },
    { k: "shell", n: "Shell, PATH & WSL" },
    { k: "git", n: "Git & GitHub" },
    { k: "test", n: "Testing & code quality" },
    { k: "ci", n: "pre-commit & CI" },
    { k: "proj", n: "Project layout & habits" }
  ];

  var QUESTIONS = [
    /* ================= Python environments & uv ================= */
    mc("e1", "env", "sys.path & imports", "In Python, what is `sys.path`?",
      "The list of folders Python searches, in order, when you import a module",
      ["The path of the script that is currently running", "A list of every package installed on the machine", "The folder where pip stores its downloads"],
      "Python goes through the entries in order and uses the first match, so the order decides which package gets imported."),
    mc("e23", "env", "sys.path & imports", "A file named `random.py` in your project folder breaks `import random`. Why?",
      "The script's folder (or the current folder) is searched first, so your file shadows the standard library module",
      ["`random` is a reserved word", "Python can import only one module per project", "Python deletes files that share a name with the standard library"],
      "Never name your own files after standard library modules or installed packages."),
    mc("e22", "env", "sys.path & imports", "Why can a test in `tests/` run `import reviewradar` although the code lives in `src/reviewradar/`?",
      "`uv sync` installed your own project into `.venv` in editable mode, so Python finds it by name",
      ["Python searches every folder on the disk", "pytest copies `src/` next to the tests", "Because the folder is called `src`"],
      "That is the `~ reviewradar==0.1.0` line you saw in the `uv` output."),
    mc("e20", "env", "virtual environments", "Physically, what is a virtual environment?",
      "A folder with its own `site-packages` (and a link to an interpreter), used by one project",
      ["A virtual machine running Linux", "A cloud server", "A zip file of your source code"],
      "Deleting the folder removes everything installed in it, so venvs are disposable."),
    mc("e2", "env", "virtual environments", "You print `sys.path` inside a virtual environment. Compared with the global Python, what is the key change?",
      "The global `site-packages` entry is replaced by the venv's own `site-packages` folder",
      ["The standard library entries disappear", "The list is empty until you activate the venv", "Only the current folder remains"],
      "The standard library entries stay. The venv brings its own `site-packages`, and a fresh one holds only `pip`, so installs in one project cannot disturb another.", true),
    mc("e21", "env", "virtual environments", "You deleted `.venv/`. What brings it back?",
      "`uv sync`, because `pyproject.toml` and `uv.lock` describe it completely",
      ["`git pull`", "Reinstalling Ubuntu", "Nothing, the project is lost"]),
    mc("e10", "env", "virtual environments", "Why should you never `pip install` into Ubuntu's own `/usr/bin/python3`?",
      "The operating system's tools depend on it, so changing its packages can break them",
      ["Ubuntu blocks all pip commands", "It makes Python run slower", "pip only works on Windows"],
      "Work inside a project virtual environment. System Python belongs to the OS."),
    mc("e3", "env", "pinning & lockfile", "Which statement about isolation and pinning is correct?",
      "A venv isolates projects from each other; a lockfile pins exact versions so others can rebuild the environment",
      ["A lockfile stops other projects from changing your packages; a venv records exact versions", "They are two names for the same thing", "Pinning only matters for the Python interpreter itself"],
      "Isolation (the venv) protects the project on your machine. Pinning (the lockfile) makes the environment reproducible elsewhere. You need both.", true),
    mc("e5", "env", "pinning & lockfile", "Why is `.venv/` ignored by Git but `uv.lock` committed?",
      "`.venv/` is large, specific to your machine, and can be rebuilt from `uv.lock`; the lockfile is the small recipe",
      ["`.venv/` contains passwords", "Git cannot store folders whose names start with a dot", "`uv.lock` is only needed on the developer's laptop"],
      "Git stores the recipe, not the cooked meal. The recipe can regenerate the meal, but not the reverse."),
    mc("e18", "env", "pinning & lockfile", "Why isn't writing `pandas==2.2.0` in `pyproject.toml` enough for full reproducibility?",
      "Pandas' own dependencies could still change underneath you; the lockfile pins those too",
      ["`==` is not allowed in `pyproject.toml`", "Pandas ignores version numbers", "pip cannot read `pyproject.toml`"]),
    mc("e17", "env", "pinning & lockfile", "What is a transitive dependency?",
      "A package that one of your dependencies needs, which you did not ask for directly",
      ["A dependency installed globally", "A dependency that only works on Linux", "A package that is no longer maintained"],
      "The lockfile records transitive dependencies too, which is why pinning only your direct dependencies is not enough."),
    mc("e6", "env", "pinning & lockfile", "What does `uv sync --locked` do differently from `uv sync`?",
      "It stops with an error if `uv.lock` is out of date, instead of quietly updating it",
      ["It installs only the development dependencies", "It ignores the lockfile completely", "It installs packages into the global Python"],
      "CI uses `--locked` so it tests exactly what is committed. A stale lockfile becomes a loud failure instead of a silent change."),
    mc("e4", "env", "pyproject.toml", "What is the difference between `pyproject.toml` and `uv.lock`?",
      "`pyproject.toml` says which versions you accept (ranges); `uv.lock` records the exact versions resolved, including dependencies of dependencies",
      ["`pyproject.toml` holds exact versions and `uv.lock` holds comments", "`uv.lock` is generated from `.venv`", "`pyproject.toml` is only used on Windows"],
      "Think \"what you want\" versus \"what you got\". Commit both files."),
    mc("e25", "env", "pyproject.toml", "What does `pytest>=9.1.1` in `pyproject.toml` mean?",
      "Any pytest version 9.1.1 or newer is acceptable; the lockfile decides which exact one is installed",
      ["Exactly 9.1.1", "Any version below 9.1.1", "Only 9.1.1 and 9.1.2"]),
    mc("e15", "env", "pyproject.toml", "Which section of `pyproject.toml` lists tools needed only for development?",
      "`[dependency-groups]` (the `dev` group)",
      ["`[project.scripts]`", "`[build-system]`", "`[tool.git]`"],
      "`[project].dependencies` lists what the app needs at runtime, `[build-system]` says how to package it, and `[project.scripts]` defines commands."),
    mc("e16", "env", "pyproject.toml", "What is `[project.scripts]` for in `pyproject.toml`?",
      "Defining a command (for example `reviewradar`) that runs a function in your package",
      ["Running scripts before every commit", "Listing the Python versions allowed", "Listing files Git should ignore"],
      "`reviewradar = \"reviewradar:main\"` means the command calls `main` from the `reviewradar` package."),
    mc("e12", "env", "uv commands", "What does `uv init` create in a folder?",
      "A `pyproject.toml`, a `.python-version` file and a `src/<name>/` package (plus a README if there is none)",
      ["A `.venv` folder with all dependencies installed", "A Dockerfile and a CI workflow", "Only an empty `README.md`"],
      "The venv appears later, on the first `uv sync` or `uv run`."),
    mc("e13", "env", "uv commands", "What does `uv run pytest` do that plain `pytest` might not?",
      "It runs pytest inside the project's environment, creating or updating `.venv` first if needed",
      ["It runs the tests twice for safety", "It installs pytest globally", "It skips the lockfile and downloads the newest pytest"]),
    mc("e14", "env", "uv commands", "What does `--dev` mean in `uv add --dev ruff pytest`?",
      "The packages are only needed while developing (a dependency group), not to run the app",
      ["The packages install into a separate Python version", "The packages are installed with administrator rights", "The packages are removed after each commit"],
      "They are listed under `[dependency-groups]` in `pyproject.toml`."),
    mc("e24", "env", "Python versions", "What is `.python-version` for?",
      "It holds the exact interpreter version for the project (such as `3.12`); `uv` reads it to pick or download that Python",
      ["It is the version number of your project", "It is the Git version", "It lists every Python installed on the machine"]),
    mc("e7", "env", "Python versions", "`requires-python = \"==3.12\"` made `uv sync` reject Python 3.12.14. Why?",
      "In version specifiers `==3.12` means exactly 3.12 (that is 3.12.0), not any 3.12.x",
      ["3.12.14 is newer than anything uv supports", "The operator must be `=`, not `==`", "`uv` cannot use patch versions at all"],
      "\"Any 3.12.x\" is written `==3.12.*` or `>=3.12,<3.13`. An exact patch pin such as `==3.12.14` works but is too strict.", true),
    mc("e8", "env", "Python versions", "Why does this project use `requires-python = \">=3.12,<3.13\"` and not `\">=3.12\"`?",
      "TensorFlow supports Python only up to 3.12, and `uv.lock` has to resolve for every Python version the range allows",
      ["Python 3.13 does not exist yet", "`<3.13` makes installs faster", "`uv` refuses ranges without an upper bound"],
      "An unbounded range makes the lockfile cover Python 3.13 and newer, where TensorFlow has no wheels. That breaks resolution in Phase 3."),
    rec("e11", "env", "Python versions", "Why was Python 3.12 pinned for ReviewRadar instead of 3.14?",
      "PyTorch supports 3.10 to 3.14 and TensorFlow supports 3.9 to 3.12, so 3.12 is the newest version both support. Re-check the supported ranges before adding libraries."),
    mc("e26", "env", "wheels & compilers", "What is a wheel?",
      "A prebuilt package file that installs without compiling",
      ["A file that rolls back an installation", "A Python version manager", "A kind of virtual environment"],
      "Wheels are built for combinations of Python version, OS and CPU. If none matches, the installer compiles from source."),
    mc("e9", "env", "wheels & compilers", "Why might installing a Python package need a C compiler?",
      "Some libraries have C/C++ cores; if no prebuilt wheel matches your Python and OS, the installer builds from source",
      ["To check your code for memory leaks", "Python cannot run without one", "To make `pip` download faster"],
      "NumPy, PyTorch and others ship precompiled wheels for common setups. Brand-new Python versions often lack wheels, which triggers a source build.", true),
    mc("e27", "env", "wheels & compilers", "Why do brand-new Python versions often cause slow or failing installs?",
      "Libraries may not have prebuilt wheels for them yet, so installers fall back to compiling from source",
      ["New Python versions delete old packages", "pip refuses to run on new versions", "Wheels only exist for old Python versions"],
      "This is one reason the project pins Python 3.12 and not 3.14."),
    cmd("k14", "env", "uv commands", "Type the command that adds `ruff` as a development dependency with uv.", ["uv add --dev ruff"], "It updates `pyproject.toml` and `uv.lock` together."),
    cmd("k15", "env", "uv commands", "Type the command that runs pytest inside the project's environment.", ["uv run pytest"]),
    cmd("k16", "env", "uv commands", "Type the command that builds `.venv` from `uv.lock` and fails if the lockfile is stale.", ["uv sync --locked"]),

    var due = ids.filter(function (id) { var r = it(id); return r.b > 0 && r.d <= t; }).sort(byDue);
    var fresh = shuffle(ids.filter(function (id) { return it(id).b === 0; }));
    var later = ids.filter(function (id) { var r = it(id); return r.b > 0 && r.d > t; }).sort(byDue);
    return due.concat(fresh, later).slice(0, n);
  }
  function weakIds() {
    return allIds().filter(function (id) {
      var r = it(id); return r.s > 0 && (r.b <= 1 || r.c / r.s < 0.6);
    }).sort(function (a, b) { return it(a).c / it(a).s - it(b).c / it(b).s; });
  }
  function sweepIds() { /* one question per subtopic, preferring the one you know least */
    var groups = {};
    QUESTIONS.forEach(function (q) { (groups[q.t + "/" + q.s] = groups[q.t + "/" + q.s] || []).push(q.id); });
    return shuffle(Object.keys(groups).map(function (k) {
      var g = shuffle(groups[k]).sort(function (a, b) { return it(a).b - it(b).b; });
      return g[0];
    }));
  }
  function streak() {
    var days = {};
    P.sessions.forEach(function (s) { days[dstr(new Date(s.t))] = 1; });
    var d = today();
    if (!days[d]) d = addDays(d, -1);
    var n = 0;
    while (days[d]) { n++; d = addDays(d, -1); }
    return n;
  }

  /* ---------------- session ---------------- */
  var view = "home";
  var S = null;

  function startSession(label, ids) {
    if (!ids.length) return;
    S = { label: label, queue: ids.map(function (id) { return { id: id, retry: false }; }), total: ids.length, i: 0, results: [], ans: null, revealed: false, answered: false, lastOk: false, opts: null, items: null, picks: [], cmdVal: "" };
    prepare();
    view = "quiz";
    render();
    window.scrollTo(0, 0);
  }
  function prepare() {
    var q = byId[S.queue[S.i].id];
    var ty = typeOf(q);
    S.ans = null; S.revealed = false; S.answered = false; S.lastOk = false; S.opts = null; S.items = null; S.picks = []; S.cmdVal = "";
    if (ty === "mc") S.opts = shuffle([{ t: q.a, ok: true }].concat(q.w.map(function (t) { return { t: t, ok: false }; })));
    if (ty === "order") S.items = shuffle(q.o.map(function (t, i) { return { t: t, i: i }; }));
  }
  function record(id, ok) {
    var r = Object.assign({ b: 0, d: "", s: 0, c: 0 }, it(id));
    var nb = ok ? Math.min(5, Math.max(2, r.b + 1)) : 1;
    r.b = nb;
    r.d = ok ? addDays(today(), INTERVALS[nb]) : today();
    r.s += 1;
    r.c += ok ? 1 : 0;
    P.items[id] = r;
  }
  function answer(ok) {
    var cur = S.queue[S.i];
    if (!cur.retry) {
      record(cur.id, ok);
      S.results.push({ id: cur.id, ok: ok });
      if (!ok) S.queue.push({ id: cur.id, retry: true });
    }
    S.answered = true;
    S.lastOk = ok;
    save();
    render();
  }
  function choose(i) { if (S.answered || !S.opts || !S.opts[i]) return; S.ans = i; answer(S.opts[i].ok); }
  function normCmd(s) { return String(s).trim().replace(/^\$\s*/, "").replace(/\s+/g, " "); }
  function checkCmd() {
    var inp = document.getElementById("cmd-input");
    if (!inp || S.answered) return;
    var v = normCmd(inp.value);
    if (!v) return;
    S.cmdVal = inp.value;
    var q = byId[S.queue[S.i].id];
    answer(q.cmd.some(function (a) { return normCmd(a) === v; }));
  }
  function checkOrder() {
    var q = byId[S.queue[S.i].id];
    if (S.answered || S.picks.length !== q.o.length) return;
    answer(S.picks.every(function (v, p) { return v === p; }));
  }
  function next() {
    S.i += 1;
    if (S.i >= S.queue.length) { finish(); return; }
    prepare();
    render();
    window.scrollTo(0, 0);
  }
  function finish() {
    var c = S.results.filter(function (r) { return r.ok; }).length;
    var ks = [];
    S.results.forEach(function (r) { var k = byId[r.id].t; if (ks.indexOf(k) < 0) ks.push(k); });
    P.sessions.push({ t: new Date().toISOString(), n: S.results.length, c: c, l: S.label, k: ks });
    P.sessions = P.sessions.slice(-60);
    save();
    view = "summary";
    render();
    window.scrollTo(0, 0);
  }

  /* ---------------- rendering ---------------- */
  var app = document.getElementById("app");
  var resetArmed = false;

  function statusText() {
    return storage === "account" ? ["Progress saved to your account", "ok"]
      : storage === "browser" ? ["Progress saved in this browser only", ""]
      : storage === "error" ? ["Account storage unreachable, saved in this browser", ""]
      : ["Checking storage", ""];
  }
  function renderStatus() {
    var el = document.getElementById("status");
    if (!el) return;
    var s = statusText();
    el.textContent = s[0];
    el.className = "chip " + s[1];
  }
  function header() {
    var s = statusText();
    return '<div class="top"><span class="crumb">reviewradar / phase-0 / quiz</span><span id="status" class="chip ' + s[1] + '">' + esc(s[0]) + "</span></div>";
  }
  function answerHTML(q) {
    var ty = typeOf(q);
    if (ty === "cmd") return '<pre class="blk">' + esc(q.cmd[0]) + "</pre>";
    if (ty === "order") return '<ol class="seq">' + q.o.map(function (t) { return "<li>" + fmt(t) + "</li>"; }).join("") + "</ol>";
    return fmt(q.a);
  }

  function renderHome() {
    var ids = allIds();
    var due = ids.filter(isDue).length;
    var fresh = ids.filter(function (id) { return it(id).b === 0; }).length;
    var solid = ids.filter(function (id) { return it(id).b >= 4; }).length;
    var n = size();
    var daily = pool(ids, n);
    var weak = weakIds();
    var sweep = sweepIds();
    var cta = due > 0 ? "Start today's session: " + daily.length + " questions (" + Math.min(due, n) + " due)"
      : fresh > 0 ? "Start today's session: " + daily.length + " new questions"
      : "Nothing due. Practice " + daily.length + " anyway";

    var topics = TOPICS.map(function (t) {
      var tq = QUESTIONS.filter(function (q) { return q.t === t.k; });
      var tid = tq.map(function (q) { return q.id; });
      var cnt = { "new": 0, learn: 0, solid: 0, master: 0 };
      tid.forEach(function (id) { cnt[level(id)]++; });
      var td = tid.filter(isDue).length;
      var subs = [];
      tq.forEach(function (q) { if (subs.indexOf(q.s) < 0) subs.push(q.s); });
      var seg = ["master", "solid", "learn", "new"].map(function (k) {
        return cnt[k] ? '<span class="s-' + k + '" style="flex:' + cnt[k] + '" title="' + k + ": " + cnt[k] + '"></span>' : "";
      }).join("");
      return '<div class="topic"><div><div class="name">' + esc(t.n) + '</div><div class="sub">' + tid.length + " questions, " + td + " due</div></div>" +
        '<div class="bar-wrap"><div class="bar" role="img" aria-label="' + cnt.master + " mastered, " + cnt.solid + " solid, " + cnt.learn + " learning, " + cnt["new"] + ' new">' + seg + "</div></div>" +
        '<button class="btn small" data-a="topic" data-k="' + t.k + '">Practice</button>' +
        '<div class="covers">Covers ' + subs.length + " areas: " + esc(subs.join(", ")) + "</div></div>";
    }).join("");

    var log = P.sessions.length ? '<ol class="log">' + P.sessions.slice(-8).reverse().map(function (s) {
      var d = new Date(s.t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      var names = (s.k || []).map(function (k) { return topicName[k] || k; }).join(", ");
      return '<li class="' + (s.c === s.n ? "perfect" : "") + '"><span class="h">' + hash7(s.t) + '</span><span class="d">' + esc(d) + "</span><span>" + s.c + "/" + s.n + '</span><span class="t">' + esc(s.l) + (names && names !== s.l ? ": " + esc(names) : "") + "</span></li>";
    }).join("") + "</ol>"
      : '<div class="empty">No sessions yet. Each session you finish is added here like a commit: a short hash, the date, your score and the topics covered.</div>';

    var sizes = [10, 20, 40].map(function (k) { return '<button class="btn small" data-a="size" data-n="' + k + '" aria-pressed="' + (n === k) + '">' + k + "</button>"; }).join("");

    return header() +
      "<h1>ReviewRadar Phase 0 Quiz</h1>" +
      '<p class="lede">' + QUESTIONS.length + " questions across " + TOPICS.length + " topics. Choose the answer, type the command, put steps in order, or recall it. Missed questions come back sooner; ones you know come back after days, then weeks.</p>" +
      '<div class="strip"><div><div class="n">' + due + '</div><div class="l">due today</div></div>' +
      '<div><div class="n">' + streak() + '<small> days</small></div><div class="l">current streak</div></div>' +
      '<div><div class="n">' + solid + "<small>/" + QUESTIONS.length + '</small></div><div class="l">solid or mastered</div></div></div>' +
      '<div class="row"><button class="btn primary" data-a="daily">' + esc(cta) + "</button>" +
      '<button class="btn" data-a="sweep">Coverage sweep (' + sweep.length + ")</button>" +
      '<button class="btn" data-a="weak"' + (weak.length ? "" : " disabled") + ">Weak spots (" + weak.length + ")</button></div>" +
      '<div class="row sizes"><span>Questions per session</span>' + sizes + "</div>" +
      '<section class="block"><h2>Topics</h2><div class="legend"><span><i class="s-master"></i>mastered</span><span><i class="s-solid"></i>solid</span><span><i class="s-learn"></i>learning</span><span><i style="border:1px solid var(--line)"></i>new</span></div>' + topics + "</section>" +
      '<section class="block"><h2>Session log</h2>' + log + "</section>" +
      '<div class="foot"><p>The coverage sweep asks one question from every area above, preferring the one you know least. Progress is kept by question id, so adding questions later does not reset anything.</p>' +
      '<span><button class="link danger" data-a="reset">' + (resetArmed ? "Click again to erase all progress" : "Reset progress") + "</button></span></div>";
  }

  function renderQuiz() {
    var cur = S.queue[S.i];
    var q = byId[cur.id];
    var ty = typeOf(q);
    var ticks = "";
    for (var n = 0; n < S.total; n++) {
      var res = S.results[n];
      ticks += '<span class="' + (n === S.results.length && !cur.retry ? "cur" : res ? (res.ok ? "ok" : "no") : "") + '"></span>';
    }
    var label = cur.retry ? "Second try" : "Question " + (S.results.length + 1) + " of " + S.total;
    var body = "";
    var lastBtn = S.i + 1 >= S.queue.length ? "Finish" : "Next";
    var nextBtn = '<div class="actions"><button class="btn primary" data-a="next">' + lastBtn + "</button></div>";
    var expl = q.x ? "<p>" + fmt(q.x) + "</p>" : "";

    if (ty === "mc") {
      body = '<div class="opts">' + S.opts.map(function (o, i) {
        var cls = "opt";
        if (S.answered) cls += o.ok ? " right" : i === S.ans ? " wrong" : " dim";
        return '<button class="' + cls + '" data-a="choose" data-i="' + i + '"' + (S.answered ? " disabled" : "") + '><span class="k">' + "ABCD"[i] + '</span><span class="tx">' + fmt(o.t) + "</span></button>";
      }).join("") + "</div>";
      body += S.answered ? '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Correct" : "Not quite") + "</div>" + expl + "</div>" + nextBtn
        : '<div class="hint">press 1 to 4 to answer</div>';
    } else if (ty === "cmd") {
      body = '<div class="cmdbox"><input id="cmd-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the command" placeholder="type the command" value="' + esc(S.cmdVal) + '"' + (S.answered ? " disabled" : "") + ">" +
        (S.answered ? "" : '<button class="btn primary" data-a="cmdcheck">Check</button>') + "</div>";
      if (S.answered) {
        var also = q.cmd.length > 1 ? '<div class="l">Also accepted</div><pre class="blk">' + esc(q.cmd.slice(1).join("\n")) + "</pre>" : "";
        body += '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Correct" : "Not quite") + "</div>" +
          (S.lastOk ? "" : '<div class="exp"><div class="l">Expected</div>' + answerHTML(q) + "</div>") +
          (S.lastOk && also ? '<div class="exp">' + also + "</div>" : "") + expl + "</div>" + nextBtn;
      } else {
        body += '<div class="hint">type it exactly as you would in the terminal, then press Enter</div>';
      }
    } else if (ty === "order") {
      body = '<p style="color:var(--muted);margin:0 0 12px">Tap the steps in the order they happen. Tap a numbered step to remove it.</p><div class="opts">' + S.items.map(function (o) {
        var pos = S.picks.indexOf(o.i);
        var cls = "opt" + (pos >= 0 && !S.answered ? " picked" : "") + (S.answered ? (S.picks[pos] === pos ? " right" : " wrong") : "");
        return '<button class="' + cls + '" data-a="' + (pos >= 0 ? "unpick" : "pick") + '" data-i="' + o.i + '"' + (S.answered ? " disabled" : "") + '><span class="k">' + (pos >= 0 ? pos + 1 : "·") + '</span><span class="tx">' + fmt(o.t) + "</span></button>";
      }).join("") + "</div>";
      if (S.answered) {
        body += '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Correct order" : "Not quite") + "</div>" +
          (S.lastOk ? "" : '<div class="exp"><div class="l">Correct order</div>' + answerHTML(q) + "</div>") + expl + "</div>" + nextBtn;
      } else {
        body += '<div class="actions"><button class="btn primary" data-a="ordcheck"' + (S.picks.length === q.o.length ? "" : " disabled") + '>Check order</button><button class="btn" data-a="ordreset"' + (S.picks.length ? "" : " disabled") + ">Start over</button></div>";
      }
    } else {
      if (!S.revealed) {
        body = '<p style="color:var(--muted);margin:0 0 4px">Answer in your head or on paper, then check.</p><div class="actions"><button class="btn primary" data-a="reveal">Show answer</button></div><div class="hint">press Enter to reveal</div>';
      } else {
        body = '<div class="answerbox">' + fmt(q.a) + "</div>";
        if (!S.answered) body += '<div class="actions"><button class="btn primary" data-a="knew">I knew it</button><button class="btn" data-a="missed">I missed it</button></div>';
        else body += '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Marked as known" : "Marked to review") + "</div></div>" + nextBtn;
      }
    }
    return header() +
      '<div class="qhead"><button class="btn small" data-a="exit">Exit</button><span class="tag">' + esc(label) + " &middot; " + esc(S.label) + "</span></div>" +
      '<div class="ticks">' + ticks + "</div>" +
      '<div class="card"><div class="tags"><span class="tag">' + esc(topicName[q.t]) + " / " + esc(q.s) + '</span><span class="pill kind">' + KIND[ty] + "</span>" + (q.m ? '<span class="pill">You hit this in Phase 0</span>' : "") + "</div>" +
      '<h2 class="q">' + fmt(q.q) + "</h2>" + body + "</div>";
  }

  function renderSummary() {
    var c = S.results.filter(function (r) { return r.ok; }).length;
    var missed = S.results.filter(function (r) { return !r.ok; });
    var msg = c === S.results.length ? "Clean sweep." : c / S.results.length >= 0.7 ? "Solid. The misses are below." : "These come back soon. Read the answers once now.";
    var list = missed.length ? '<ul class="missed">' + missed.map(function (r) {
      var q = byId[r.id];
      return '<li><div class="mq">' + fmt(q.q) + '</div><div class="ma">' + answerHTML(q) + "</div></li>";
    }).join("") + "</ul>" : "";
    return header() + "<h1>Session complete</h1>" +
      '<div class="score" style="margin-top:20px">' + c + "<small>/" + S.results.length + "</small></div>" +
      '<p class="lede">' + msg + "</p>" + list +
      '<div class="row" style="margin-top:28px">' + (missed.length ? '<button class="btn primary" data-a="retry">Retry the ' + missed.length + " missed</button>" : "") +
      '<button class="btn' + (missed.length ? "" : " primary") + '" data-a="home">Back to dashboard</button></div>';
  }

  function render() {
    app.innerHTML = view === "quiz" ? renderQuiz() : view === "summary" ? renderSummary() : renderHome();
    if (view === "quiz" && S && !S.answered && typeOf(byId[S.queue[S.i].id]) === "cmd") {
      var inp = document.getElementById("cmd-input");
      if (inp) inp.focus();
    }
  }

  /* ---------------- events ---------------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]");
    if (!b) return;
    var a = b.getAttribute("data-a");
    var ids = allIds();
    if (a !== "reset" && resetArmed) { resetArmed = false; }
    if (a === "daily") startSession("Daily", pool(ids, size()));
    else if (a === "sweep") startSession("Coverage sweep", sweepIds());
    else if (a === "weak") startSession("Weak spots", weakIds().slice(0, size()));
    else if (a === "topic") { var k = b.getAttribute("data-k"); startSession(topicName[k], pool(ids.filter(function (id) { return byId[id].t === k; }), size())); }
    else if (a === "size") { P.size = Number(b.getAttribute("data-n")); save(); render(); }
    else if (a === "choose") choose(Number(b.getAttribute("data-i")));
    else if (a === "cmdcheck") checkCmd();
    else if (a === "pick") { var pi = Number(b.getAttribute("data-i")); if (!S.answered && S.picks.indexOf(pi) < 0) { S.picks.push(pi); render(); } }
    else if (a === "unpick") { var ui = Number(b.getAttribute("data-i")); if (!S.answered) { S.picks = S.picks.filter(function (x) { return x !== ui; }); render(); } }
    else if (a === "ordreset") { S.picks = []; render(); }
    else if (a === "ordcheck") checkOrder();
    else if (a === "reveal") { S.revealed = true; render(); }
    else if (a === "knew") answer(true);
    else if (a === "missed") answer(false);
    else if (a === "next") next();
    else if (a === "exit") { view = "home"; S = null; render(); }
    else if (a === "home") { view = "home"; S = null; render(); window.scrollTo(0, 0); }
    else if (a === "retry") { var m = S.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; }); startSession("Retry missed", m); }
    else if (a === "reset") {
      if (!resetArmed) { resetArmed = true; render(); }
      else { resetArmed = false; P = { v: 1, u: 0, size: P.size || 10, items: {}, sessions: [] }; save(); render(); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (view !== "quiz" || !S || e.ctrlKey || e.metaKey || e.altKey) return;
    var q = byId[S.queue[S.i].id];
    var ty = typeOf(q);
    var ae = document.activeElement;
    if (ae && ae.id === "cmd-input") {
      if (e.key === "Enter") { e.preventDefault(); checkCmd(); }
      return;
    }
    var onButton = ae && ae.tagName === "BUTTON";
    var i = "1234".indexOf(e.key);
    if (i < 0) i = "abcd".indexOf(e.key.toLowerCase());
    if (ty === "mc" && !S.answered && i >= 0 && e.key.length === 1) { e.preventDefault(); choose(i); return; }
    if (e.key === "Enter" && !onButton) {
      e.preventDefault();
      if (ty === "recall" && !S.revealed) { S.revealed = true; render(); }
      else if (ty === "cmd" && !S.answered) { checkCmd(); }
      else if (ty === "order" && !S.answered) { checkOrder(); }
      else if (S.answered) next();
    }
  });

  /* ---------------- start ---------------- */
  var local = loadLocal();
  if (local) P = local;
  render();
  initStore();
})();
</script>
