<title>ReviewRadar Phase 0 Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column, three views (dashboard, question, summary). The only decorative device is a git-log style session history. */
:root {
  --bg: #F1F4F5;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6A77;
  --line: #D3DBE0;
  --code-bg: #E8EDF0;
  --accent: #2742C9;
  --accent-ink: #FFFFFF;
  --good: #1B7547;
  --good-bg: #E1F2E8;
  --bad: #B3261E;
  --bad-bg: #FBE5E3;
  --warn: #9A5B00;
  --warn-bg: #FBEFD6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A;
    --surface: #151D25;
    --ink: #E6EDF2;
    --muted: #93A3B0;
    --line: #27333E;
    --code-bg: #1C2630;
    --accent: #8CA0FF;
    --accent-ink: #0E141A;
    --good: #5BD08F;
    --good-bg: #12291D;
    --bad: #FF8A80;
    --bad-bg: #33181A;
    --warn: #E8B45A;
    --warn-bg: #2E2410;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A;
  --surface: #151D25;
  --ink: #E6EDF2;
  --muted: #93A3B0;
  --line: #27333E;
  --code-bg: #1C2630;
  --accent: #8CA0FF;
  --accent-ink: #0E141A;
  --good: #5BD08F;
  --good-bg: #12291D;
  --bad: #FF8A80;
  --bad-bg: #33181A;
  --warn: #E8B45A;
  --warn-bg: #2E2410;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 56px; }
#wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre.blk { font-family: var(--mono); font-size: 0.85rem; background: var(--code-bg); padding: 10px 12px; border-radius: 6px; margin: 0; overflow-x: auto; white-space: pre; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.crumb { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.chip { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.chip.ok { color: var(--good); border-color: var(--good); }
h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.1; }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 56ch; }

.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-block: 24px; border-block: 1px solid var(--line); }
.strip > div { padding: 14px 4px 14px 0; }
.strip > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.strip .n { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.strip .n small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.strip .l { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; transition: border-color 0.15s, background 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: 0.88rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

section.block { margin-top: 36px; }
section.block > h2 { font-size: 1.15rem; margin-bottom: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin: -4px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.topic { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.topic:last-child { border-bottom: 1px solid var(--line); }
.topic .name { font-weight: 600; }
.topic .sub { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--line); gap: 1px; }
.bar span { display: block; min-width: 0; }
.s-new { background: var(--line); }
.s-learn { background: var(--warn); }
.s-solid { background: var(--accent); }
.s-master { background: var(--good); }
.bar .s-new { background: transparent; }

.log { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); font-family: var(--mono); font-size: 0.82rem; }
.log li { position: relative; padding: 6px 0 6px 16px; display: grid; grid-template-columns: 4.6em 4.8em 3.4em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.log li::before { content: ""; position: absolute; left: -22px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.log li.perfect::before { background: var(--good); border-color: var(--good); }
.log .h { color: var(--warn); }
.log .d { color: var(--muted); }
.log .t { color: var(--muted); font-family: var(--body); font-size: 0.82rem; overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); font-size: 0.92rem; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.ticks { display: flex; gap: 3px; margin-bottom: 20px; }
.ticks span { flex: 1; height: 5px; border-radius: 2px; background: var(--line); min-width: 0; }
.ticks .ok { background: var(--good); }
.ticks .no { background: var(--bad); }
.ticks .cur { background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 4vw, 26px); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tag { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pill { font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.q { font-family: var(--display); font-weight: 600; font-size: clamp(1.1rem, 3.4vw, 1.35rem); line-height: 1.3; margin: 0 0 18px; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 14px; transition: border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); padding-top: 2px; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: 0.55; }
.feedback { margin-top: 18px; border-radius: 8px; padding: 14px 16px; }
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--bad-bg); }
.feedback .v { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .v { color: var(--good); }
.feedback.no .v { color: var(--bad); }
.feedback p { margin: 4px 0 0; }
.answerbox { margin-top: 4px; border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--bg); border-radius: 0 8px 8px 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 14px; font-family: var(--mono); }

.score { font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 14vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 0.4em; color: var(--muted); }
.missed { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.missed li { border-left: 3px solid var(--bad); padding: 4px 0 4px 14px; }
.missed .mq { font-weight: 600; margin-bottom: 4px; }
.missed .ma { color: var(--muted); font-size: 0.92rem; }
.foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; align-items: baseline; }
.foot p { margin: 0; max-width: 52ch; }
.link { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 0.82rem; }
.link.danger { color: var(--bad); }

@media (max-width: 560px) {
  .topic { grid-template-columns: minmax(0, 1fr) auto; }
  .topic .bar-wrap { grid-column: 1 / -1; order: 3; }
  .log li { grid-template-columns: 4.4em 3.4em minmax(0, 1fr); }
  .log .d { display: none; }
  .strip .n { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="wrap"><div id="app"></div></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Question bank. Source of truth: docs/QUIZ_SEED.md in the repo.
     a = correct answer, w = wrong options, x = explanation,
     m = a mistake that really happened in Phase 0, r = recall (self-graded).
     Keep ids stable: progress is stored by id.
     --------------------------------------------------------------- */
  var TOPICS = [
    { k: "env", n: "Python environments" },
    { k: "shell", n: "Shell, PATH & WSL" },
    { k: "git", n: "Git & GitHub" },
    { k: "test", n: "Testing & code quality" },
    { k: "ci", n: "pre-commit & CI" }
  ];

  var QUESTIONS = [
    /* ---- Python environments ---- */
    { id: "e1", t: "env", q: "In Python, what is `sys.path`?",
      a: "The list of folders Python searches, in order, when you import a module",
      w: ["The path of the script that is currently running", "A list of every package installed on the machine", "The folder where pip stores its downloads"],
      x: "Python goes through the entries in order and uses the first match, so the order decides which package gets imported." },
    { id: "e2", t: "env", m: true, q: "You print `sys.path` inside a virtual environment. Compared with the global Python, what is the key change?",
      a: "The global `site-packages` entry is replaced by the venv's own `site-packages` folder",
      w: ["The standard library entries disappear", "The list is empty until you activate the venv", "Only the current folder remains"],
      x: "The standard library entries stay. The venv brings its own `site-packages`, and a fresh one holds only `pip`, so installs in one project cannot disturb another." },
    { id: "e3", t: "env", m: true, q: "Which statement about isolation and pinning is correct?",
      a: "A venv isolates projects from each other; a lockfile pins exact versions so others can rebuild the environment",
      w: ["A lockfile stops other projects from changing your packages; a venv records exact versions", "They are two names for the same thing", "Pinning only matters for the Python interpreter itself"],
      x: "Isolation (the venv) protects the project on your machine. Pinning (the lockfile) makes the environment reproducible elsewhere. You need both." },
    { id: "e4", t: "env", q: "What is the difference between `pyproject.toml` and `uv.lock`?",
      a: "`pyproject.toml` says which versions you accept (ranges); `uv.lock` records the exact versions resolved, including dependencies of dependencies",
      w: ["`pyproject.toml` holds exact versions and `uv.lock` holds comments", "`uv.lock` is generated from `.venv`", "`pyproject.toml` is only used on Windows"],
      x: "Think \"what you want\" versus \"what you got\". Commit both files." },
    { id: "e5", t: "env", q: "Why is `.venv/` ignored by Git but `uv.lock` committed?",
      a: "`.venv/` is large, specific to your machine, and can be rebuilt from `uv.lock`; the lockfile is the small recipe",
      w: ["`.venv/` contains passwords", "Git cannot store folders whose names start with a dot", "`uv.lock` is only needed on the developer's laptop"],
      x: "Git stores the recipe, not the cooked meal. The recipe can regenerate the meal, but not the reverse." },
    { id: "e6", t: "env", q: "What does `uv sync --locked` do differently from `uv sync`?",
      a: "It stops with an error if `uv.lock` is out of date, instead of quietly updating it",
      w: ["It installs only the development dependencies", "It ignores the lockfile completely", "It installs packages into the global Python"],
      x: "CI uses `--locked` so it tests exactly what is committed. A stale lockfile becomes a loud failure instead of a silent change." },
    { id: "e7", t: "env", m: true, q: "`requires-python = \"==3.12\"` made `uv sync` reject Python 3.12.14. Why?",
      a: "In version specifiers `==3.12` means exactly 3.12 (that is 3.12.0), not any 3.12.x",
      w: ["3.12.14 is newer than anything uv supports", "The operator must be `=`, not `==`", "`uv` cannot use patch versions at all"],
      x: "\"Any 3.12.x\" is written `==3.12.*` or `>=3.12,<3.13`. An exact patch pin such as `==3.12.14` works but is too strict." },
    { id: "e8", t: "env", q: "Why does this project use `requires-python = \">=3.12,<3.13\"` and not `\">=3.12\"`?",
      a: "TensorFlow supports Python only up to 3.12, and `uv.lock` has to resolve for every Python version the range allows",
      w: ["Python 3.13 does not exist yet", "`<3.13` makes installs faster", "`uv` refuses ranges without an upper bound"],
      x: "An unbounded range makes the lockfile cover Python 3.13 and newer, where TensorFlow has no wheels. That breaks resolution in Phase 3." },
    { id: "e9", t: "env", m: true, q: "Why might installing a Python package need a C compiler?",
      a: "Some libraries have C/C++ cores; if no prebuilt wheel matches your Python and OS, the installer builds from source",
      w: ["To check your code for memory leaks", "Python cannot run without one", "To make `pip` download faster"],
      x: "NumPy, PyTorch and others ship precompiled wheels for common setups. Brand-new Python versions often lack wheels, which triggers a source build." },
    { id: "e10", t: "env", q: "Why should you never `pip install` into Ubuntu's own `/usr/bin/python3`?",
      a: "The operating system's tools depend on it, so changing its packages can break them",
      w: ["Ubuntu blocks all pip commands", "It makes Python run slower", "pip only works on Windows"],
      x: "Work inside a project virtual environment. System Python belongs to the OS." },
    { id: "e11", t: "env", r: true, q: "Why was Python 3.12 pinned for ReviewRadar instead of 3.14?",
      a: "PyTorch supports 3.10 to 3.14 and TensorFlow supports 3.9 to 3.12, so 3.12 is the newest version both support. Re-check the supported ranges before adding libraries." },

    /* ---- Shell, PATH & WSL ---- */
    { id: "s1", t: "shell", q: "You type `uv` in the terminal. How does the shell find the program?",
      a: "It searches the folders listed in `PATH`, in order, and runs the first match",
      w: ["It searches the whole disk for a file named `uv`", "It asks GitHub for the latest version", "It looks only in the current folder"],
      x: "The installer put `uv` in `~/.local/bin` and added that folder to `PATH` through `.bashrc` and `.profile`." },
    { id: "s2", t: "shell", m: true, q: "`cd ~/projects/reviewradar` failed with \"path does not exist\" in VS Code's terminal, though it works in Ubuntu. Why?",
      a: "That terminal was PowerShell, where `~` means `C:\\Users\\manol`, not the Linux home folder",
      w: ["The folder was deleted", "`cd` does not work in VS Code", "Git had locked the folder"],
      x: "The same symbol expands differently in each shell. VS Code was not connected to WSL; running `code .` from Ubuntu fixes it." },
    { id: "s3", t: "shell", q: "Which prompt shows you are in Ubuntu?",
      a: "`mjvargas99@MSI:~/projects/reviewradar$`",
      w: ["`PS C:\\Users\\manol>`", "`PS Microsoft.PowerShell.Core\\FileSystem::\\\\wsl.localhost\\Ubuntu\\home\\mjvargas99>`", "`C:\\Users\\manol>`"],
      x: "The second option looks Linux-like but starts with `PS`: that is PowerShell reaching into WSL over a network path. An Ubuntu prompt reads `user@host:folder$`." },
    { id: "s4", t: "shell", m: true, q: "In PowerShell, `where python` prints nothing although Python is installed. Why?",
      a: "`where` is a PowerShell alias for a different command; the program you want is `where.exe`",
      w: ["Python must be reinstalled", "`where` only works inside WSL", "PowerShell cannot find programs on the PATH"],
      x: "Use `where.exe python` or `Get-Command python`." },
    { id: "s5", t: "shell", q: "What is `/mnt/c` inside WSL?",
      a: "Your Windows C: drive, seen from Linux",
      w: ["A folder for temporary Linux files", "The folder where Ubuntu is installed", "A network drive on GitHub"],
      x: "Keep project work in the Linux home (`~/projects/...`). It is faster and avoids permission surprises with Linux tools." },
    { id: "s6", t: "shell", q: "Why does `apt install` need `sudo` while creating a venv does not?",
      a: "`apt` writes to system-wide folders owned by root and shared by every user; a venv writes to your own folders",
      w: ["`apt` downloads more data", "Venvs are not real software", "`sudo` makes commands run faster"],
      x: "Use `sudo` only when you understand what the command does. If something asks for `sudo pip install`, stop." },
    { id: "s7", t: "shell", m: true, q: "You typed `import sys; print(sys.path)` at the PowerShell prompt and got \"The term 'import' is not recognized\". What happened?",
      a: "PowerShell tried to run `import` as its own command; the code has to be passed to Python, for example with `python -c \"...\"`",
      w: ["Python is not installed", "The semicolon is invalid in PowerShell", "`sys.path` is not a valid name"],
      x: "When something breaks, first ask which program is complaining. It tells you whose rules you broke." },
    { id: "s8", t: "shell", m: true, q: "`curl -LsSf <url>` works but `curl -LsFf <url>` fails with \"option -LsFf: is badly used here\". Why?",
      a: "Each letter is a separate flag, and `-F` (send form data) is a different option from `-S` (show errors)",
      w: ["`curl` only accepts four flags", "Capital letters are not allowed", "The URL must come first"],
      x: "One similar-looking character changes the meaning. Use the up arrow to edit the last command instead of retyping it." },
    { id: "s9", t: "shell", r: true, q: "What are files whose names start with `.`, and how do you list them?",
      a: "Hidden files, mostly configuration. `ls -a` lists them. For example `.bashrc` runs every time a shell starts, and `.gitignore` configures Git." },

    /* ---- Git & GitHub ---- */
    { id: "g1", t: "git", q: "What does `git add` do?",
      a: "It puts changes into the staging area, marking what goes into the next commit",
      w: ["It uploads your commits to GitHub", "It creates a commit", "It downloads new commits"],
      x: "Keeping `add` and `commit` separate lets you commit only the changes that belong together." },
    { id: "g2", t: "git", q: "What is the difference between `git fetch` and `git pull`?",
      a: "`fetch` downloads new commits without touching your files; `pull` is fetch plus a merge into your current branch",
      w: ["`pull` only works on `main`", "`fetch` uploads and `pull` downloads", "They are identical"],
      x: "Use `fetch` first when you want to see what changed before merging." },
    { id: "g3", t: "git", m: true, q: "After `git pull` added a `.gitignore`, `git status` still listed `src/` as untracked. Why?",
      a: "`.gitignore` lists what to ignore; `src/` was not listed, so it is untracked (new), not ignored",
      w: ["`src/` was listed in `.gitignore`", "Git cannot track folders named `src`", "The pull failed"],
      x: "Files are tracked, untracked or ignored. `git check-ignore -v <path>` shows which rule matches." },
    { id: "g4", t: "git", m: true, q: "You ran `git add file`, then a hook rewrote `file`. What does `git status` show?",
      a: "The file appears twice: staged (the old snapshot) and modified-not-staged (the new version); you must `git add` it again",
      w: ["Nothing, the hook's change is staged automatically", "An error saying the file is corrupted", "The file is deleted from the index"],
      x: "Staging takes a snapshot at the moment you run `git add`. Later edits are not part of it." },
    { id: "g5", t: "git", m: true, q: "You committed on `main` by mistake and have not pushed. What is the clean fix?",
      a: "`git switch -c new-branch` to label your commit, then `git branch -f main origin/main` to move `main` back",
      w: ["`git reset --hard HEAD~1`, which discards the commit", "Delete the repo and clone again", "`git push --force` to `main`"],
      x: "A branch is just a label on a commit. Create the new label, then move the old one back. The commit survives on the new branch." },
    { id: "g6", t: "git", q: "`git pull` printed \"Fast-forward\". What does that mean?",
      a: "Your branch had no commits of its own, so Git just moved the pointer forward, with no merge commit",
      w: ["A conflict was resolved automatically", "The pull was skipped", "Your commits were rewritten"],
      x: "It is the simplest kind of merge: nothing diverged." },
    { id: "g7", t: "git", q: "After a squash-merged pull request, `git branch -d feature` refuses to delete the branch. Why?",
      a: "Only one squashed commit reached `main`, so Git cannot tell the branch is merged; `-D` forces the deletion",
      w: ["The branch is locked on GitHub", "`-d` only works on `main`", "The branch has uncommitted changes"],
      x: "Use `-D` only when you are sure the work is merged. On an unmerged branch it can lose work." },
    { id: "g8", t: "git", q: "Why open a pull request instead of pushing straight to `main`?",
      a: "It gets review and automated checks (CI) before the change joins `main`, which stays stable",
      w: ["Pull requests make Git faster", "GitHub forbids pushing to `main`", "It deletes the branch automatically"],
      x: "A pull request is a GitHub feature, not a Git command." },
    { id: "g9", t: "git", q: "Which SSH key file do you paste into GitHub?",
      a: "The public key (`.pub`); the private key never leaves your machine",
      w: ["The private key", "Both keys", "Neither, GitHub generates its own"],
      x: "The passphrase protects the private key file if someone copies it." },
    { id: "g10", t: "git", q: "`error: src refspec phase-0-tooling does not match any` on `git push` means:",
      a: "There is no local branch with that name (it was never created)",
      w: ["GitHub is down", "Your SSH key expired", "The branch is protected"],
      x: "Check with `git branch` before pushing." },
    { id: "g11", t: "git", q: "You have uncommitted changes and run `git switch -c new-branch`. What happens to them?",
      a: "They come along: uncommitted changes are not tied to a branch",
      w: ["They are discarded", "Git refuses to switch", "They are committed automatically"],
      x: "Only commits belong to branches. Changes in the working folder stay put." },
    { id: "g12", t: "git", r: true, q: "Name the four places your work can be in Git and the command that moves it from one to the next.",
      a: "Working folder, then (`add`) staging area, then (`commit`) local repository, then (`push`) remote on GitHub. `fetch` and `pull` bring remote commits back." },

    /* ---- Testing & code quality ---- */
    { id: "t1", t: "test", q: "How does pytest find your tests?",
      a: "In files named `test_*.py`, in functions named `test_*`",
      w: ["Every `.py` file in the project", "Only files inside `src/`", "Functions decorated with `@test`"],
      x: "Discovery is by naming convention, so a misnamed file is silently never run." },
    { id: "t2", t: "test", q: "A test calls `main()` but has no `assert`. What does it prove?",
      a: "Only that nothing raised an error (a smoke test), not that the output is right",
      w: ["That the output is correct", "That the function returns `None`", "Nothing, pytest ignores such tests"],
      x: "Add an `assert` on a result you can name, such as printed text." },
    { id: "t3", t: "test", q: "What does the `capsys` fixture do?",
      a: "It captures what your code prints so you can assert on it; you request it by naming it as a test parameter",
      w: ["It measures how long a test takes", "It captures screenshots", "It mocks the network"],
      x: "`capsys.readouterr().out` holds the printed text, and `print` adds a trailing `\\n`." },
    { id: "t4", t: "test", q: "pytest shows `assert 'Hello\\n' == 'Hello'`. Which side is the actual value?",
      a: "The left side is the actual value, the right side is the expected one",
      w: ["The right side is the actual value", "Both sides are expected", "The longer one is the actual value"],
      x: "Here the code printed a newline that the expected text lacked." },
    { id: "t5", t: "test", q: "What is the difference between `ruff check` and `ruff format`?",
      a: "`check` finds likely bugs and style problems (like an unused import); `format` rewrites layout",
      w: ["`check` rewrites files and `format` only reports", "They run the same rules", "`format` runs the tests"],
      x: "`--check` makes `ruff format` report without changing files; `--diff` shows what would change." },
    { id: "t6", t: "test", q: "A diff shows `\\ No newline at end of file`. What does it mean?",
      a: "The last line of the file lacks a trailing newline character",
      w: ["The file is empty", "The file has Windows line endings", "Git lost part of the file"],
      x: "Text files should end with a newline. The `end-of-file-fixer` hook adds it, and VS Code can too with \"insert final newline\"." },

    /* ---- pre-commit & CI ---- */
    { id: "c1", t: "ci", q: "Why do the `.sample` files in `.git/hooks` do nothing?",
      a: "Git runs a hook only if the file has the exact hook name, without `.sample`",
      w: ["They are encrypted", "They only run on Windows", "They run only on `main`"],
      x: "`pre-commit install` writes a real file named `pre-commit` into that folder." },
    { id: "c2", t: "ci", m: true, q: "pre-commit reports \"files were modified by this hook\" and the commit is blocked. What now?",
      a: "Run `git add` on the fixed files and commit again",
      w: ["Use `git commit --no-verify`", "Reinstall pre-commit", "Nothing, the commit already succeeded"],
      x: "The hook fixed your working file, but your staged snapshot is still the old one." },
    { id: "c3", t: "ci", q: "`check yaml` shows \"(no files to check) Skipped\", though a YAML file exists. Why?",
      a: "The file was untracked, and pre-commit only checks tracked or staged files",
      w: ["YAML is not supported", "The hook is broken", "The file is too large"],
      x: "Once the file was staged for a commit, the hook ran on it." },
    { id: "c4", t: "ci", m: true, q: "Which line is a correct YAML list item?",
      a: "- repo: https://github.com/astral-sh/ruff-pre-commit",
      w: ["-repo: https://github.com/astral-sh/ruff-pre-commit", "repo: - https://github.com/astral-sh/ruff-pre-commit", "* repo: https://github.com/astral-sh/ruff-pre-commit"],
      x: "A list item is a dash and a space. The other keys of that item (`rev`, `hooks`) line up under `repo`. Indent with spaces, never tabs." },
    { id: "c5", t: "ci", m: true, q: "Which settings belong to the local pytest hook?",
      a: "entry: uv run pytest\nlanguage: system\npass_filenames: false",
      w: ["entry: uv run pytest\nlanguage: system\npass_filenames: []", "entry: ./scripts/pytest.sh\nlanguage: system\npass_filenames: true", "entry: pytest\nlanguage: python\npass_filenames: true"],
      x: "`pass_filenames` is a boolean (`[]` is a list). `false` runs the whole suite instead of passing file names to pytest." },
    { id: "c6", t: "ci", q: "A pre-commit hook passes. Why don't you see its output?",
      a: "pre-commit hides the output of hooks that pass, unless they are set to verbose",
      w: ["The hook did not run", "Output goes to a log file inside `.git`", "Passing hooks print only in CI"],
      x: "\"Passed\" means it ran and exited with code 0." },
    { id: "c7", t: "ci", q: "Why run the same checks in CI if pre-commit already runs them locally?",
      a: "pre-commit can be skipped or never installed; CI runs on a clean machine for every pull request and cannot be bypassed",
      w: ["CI is faster", "pre-commit cannot run tests", "GitHub requires two copies of every check"],
      x: "Local hooks give fast feedback; CI is the guard nobody can skip." },
    { id: "c8", t: "ci", q: "What must a CI job do before `uv sync --locked`?",
      a: "Get the code (checkout) and install `uv`",
      w: ["Install Python manually", "Run `git pull` on the runner", "Create a `.venv` by hand"],
      x: "The runner starts empty. `uv` fetches the pinned Python by itself." },
    { id: "c9", t: "ci", q: "`astral-sh/setup-uv@v10` fails but `@v10.2.0` works. What explains it?",
      a: "That action publishes only exact version tags, with no floating major tag; check with `git ls-remote --tags <url>`",
      w: ["The action was deleted", "Major versions are never allowed in workflows", "GitHub caches old tags"],
      x: "`actions/checkout@v7` does have a floating major tag, so conventions differ per action." },
    { id: "c10", t: "ci", q: "Why is the second CI run faster than the first?",
      a: "The first run saved a cache of downloaded packages, and later runs restore it",
      w: ["GitHub gives repeat runs faster machines", "The tests are skipped", "Hooks are disabled after the first run"],
      x: "The log lines \"No GitHub Actions cache found\" and \"uv cache saved\" show it happening." },
    { id: "c11", t: "ci", q: "Why might pytest move from a pre-commit hook to CI as the project grows?",
      a: "Slow hooks tempt people to bypass them with `--no-verify`; CI can run slow checks without blocking every commit",
      w: ["pytest cannot run inside hooks", "CI is cheaper than hooks", "Hooks cannot run Python"],
      x: "Run fast checks on commit and slow ones in CI or on push." },
    { id: "c12", t: "ci", r: true, q: "List the steps a clean CI machine needs, in order, to go from the repo to \"all checks passed\".",
      a: "Get the code (checkout), install `uv`, `uv sync --locked`, then `uv run pre-commit run --all-files`, which runs the whitespace, end-of-file and YAML hooks, ruff check and format, and pytest." }
  ];

  /* ---------------- helpers ---------------- */
  var INTERVALS = [0, 1, 3, 7, 14, 30]; /* days until a question returns, by box 1 to 5 */
  var LKEY = "rr-quiz-v1";
  var byId = {};
  QUESTIONS.forEach(function (q) { byId[q.id] = q; });
  var topicName = {};
  TOPICS.forEach(function (t) { topicName[t.k] = t.n; });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) {
    if (s.indexOf("\n") >= 0) return '<pre class="blk">' + esc(s) + "</pre>";
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function addDays(s, n) { var p = s.split("-").map(Number); return dstr(new Date(p[0], p[1] - 1, p[2] + n)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function hash7(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, "0").slice(0, 7); }

  /* ---------------- progress + storage ---------------- */
  var P = { v: 1, u: 0, items: {}, sessions: [] };
  var storage = "checking"; /* checking | account | browser | error */
  var dbDoc = null;
  var saveTimer = null;
  var writing = Promise.resolve();

  function normalize(o) {
    var r = { v: 1, u: (o && o.u) || 0, items: {}, sessions: [] };
    if (o && o.items) Object.keys(o.items).forEach(function (id) { if (byId[id]) r.items[id] = o.items[id]; });
    if (o && Array.isArray(o.sessions)) r.sessions = o.sessions.slice(-60);
    return r;
  }
  function cacheLocal() { try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch (e) { /* storage may be blocked */ } }
  function loadLocal() { try { var s = localStorage.getItem(LKEY); if (s) return normalize(JSON.parse(s)); } catch (e) { /* ignore */ } return null; }
  function writeRemote() {
    if (!dbDoc) return Promise.resolve();
    return dbDoc.set(JSON.parse(JSON.stringify(P))).then(function () { storage = "account"; renderStatus(); });
  }
  function save() {
    P.u = Date.now();
    cacheLocal();
    if (!dbDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      writing = writing.then(writeRemote).catch(function () { storage = "error"; renderStatus(); });
    }, 700);
  }
  function initStore() {
    if (!(window.claude && window.claude.use)) { storage = "browser"; renderStatus(); return; }
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { storage = "browser"; renderStatus(); return; }
      return user.id().then(function (id) {
        if (!id) { storage = "browser"; renderStatus(); return; }
        dbDoc = db.collection("data/users/" + id).doc("quiz");
        return dbDoc.get().then(function (snap) {
          var remote = snap.exists ? snap.data() : null;
          if (remote && (remote.u || 0) >= (P.u || 0)) { P = normalize(remote); cacheLocal(); storage = "account"; }
          else if (P.u > 0) { return writeRemote(); }
          else { storage = "account"; }
          renderStatus();
          if (view === "home") render();
        });
      });
    }).catch(function () { dbDoc = null; storage = "browser"; renderStatus(); });
  }

  function it(id) { return P.items[id] || { b: 0, d: "", s: 0, c: 0 }; }
  function isDue(id) { var r = it(id); return r.b > 0 && r.d <= today(); }
  function level(id) { var b = it(id).b; return b === 0 ? "new" : b <= 2 ? "learn" : b <= 4 ? "solid" : "master"; }

  function pool(ids, n) {
    var t = today();
    var byDue = function (a, b) { return it(a).d < it(b).d ? -1 : it(a).d > it(b).d ? 1 : 0; };
    var due = ids.filter(function (id) { var r = it(id); return r.b > 0 && r.d <= t; }).sort(byDue);
    var fresh = shuffle(ids.filter(function (id) { return it(id).b === 0; }));
    var later = ids.filter(function (id) { var r = it(id); return r.b > 0 && r.d > t; }).sort(byDue);
    return due.concat(fresh, later).slice(0, n);
  }
  function weakIds() {
    return QUESTIONS.map(function (q) { return q.id; }).filter(function (id) {
      var r = it(id); return r.s > 0 && (r.b <= 1 || r.c / r.s < 0.6);
    }).sort(function (a, b) { return it(a).c / it(a).s - it(b).c / it(b).s; });
  }
  function streak() {
    var days = {};
    P.sessions.forEach(function (s) { days[dstr(new Date(s.t))] = 1; });
    var d = today();
    if (!days[d]) d = addDays(d, -1);
    var n = 0;
    while (days[d]) { n++; d = addDays(d, -1); }
    return n;
  }

  /* ---------------- session ---------------- */
  var view = "home";
  var S = null;

  function startSession(label, ids) {
    if (!ids.length) return;
    S = { label: label, queue: ids.map(function (id) { return { id: id, retry: false }; }), total: ids.length, i: 0, results: [], ans: null, revealed: false, answered: false, lastOk: false, opts: null };
    prepare();
    view = "quiz";
    render();
    window.scrollTo(0, 0);
  }
  function prepare() {
    var q = byId[S.queue[S.i].id];
    S.ans = null; S.revealed = false; S.answered = false; S.lastOk = false;
    S.opts = q.r ? null : shuffle([{ t: q.a, ok: true }].concat(q.w.map(function (t) { return { t: t, ok: false }; })));
  }
  function record(id, ok) {
    var r = Object.assign({ b: 0, d: "", s: 0, c: 0 }, it(id));
    var nb = ok ? Math.min(5, Math.max(2, r.b + 1)) : 1;
    r.b = nb;
    r.d = ok ? addDays(today(), INTERVALS[nb]) : today();
    r.s += 1;
    r.c += ok ? 1 : 0;
    P.items[id] = r;
  }
  function answer(ok) {
    var cur = S.queue[S.i];
    if (!cur.retry) {
      record(cur.id, ok);
      S.results.push({ id: cur.id, ok: ok });
      if (!ok) S.queue.push({ id: cur.id, retry: true });
    }
    S.answered = true;
    S.lastOk = ok;
    save();
    render();
  }
  function choose(i) { if (S.answered || !S.opts || !S.opts[i]) return; S.ans = i; answer(S.opts[i].ok); }
  function next() {
    S.i += 1;
    if (S.i >= S.queue.length) { finish(); return; }
    prepare();
    render();
    window.scrollTo(0, 0);
  }
  function finish() {
    var c = S.results.filter(function (r) { return r.ok; }).length;
    var ks = [];
    S.results.forEach(function (r) { var k = byId[r.id].t; if (ks.indexOf(k) < 0) ks.push(k); });
    P.sessions.push({ t: new Date().toISOString(), n: S.results.length, c: c, l: S.label, k: ks });
    P.sessions = P.sessions.slice(-60);
    save();
    view = "summary";
    render();
    window.scrollTo(0, 0);
  }

  /* ---------------- rendering ---------------- */
  var app = document.getElementById("app");

  function statusText() {
    return storage === "account" ? ["Progress saved to your account", "ok"]
      : storage === "browser" ? ["Progress saved in this browser only", ""]
      : storage === "error" ? ["Account storage unreachable, saved in this browser", ""]
      : ["Checking storage", ""];
  }
  function renderStatus() {
    var el = document.getElementById("status");
    if (!el) return;
    var s = statusText();
    el.textContent = s[0];
    el.className = "chip " + s[1];
  }

  function header() {
    var s = statusText();
    return '<div class="top"><span class="crumb">reviewradar / phase-0 / quiz</span><span id="status" class="chip ' + s[1] + '">' + esc(s[0]) + "</span></div>";
  }

  function renderHome() {
    var ids = QUESTIONS.map(function (q) { return q.id; });
    var due = ids.filter(isDue).length;
    var fresh = ids.filter(function (id) { return it(id).b === 0; }).length;
    var solid = ids.filter(function (id) { return it(id).b >= 4; }).length;
    var daily = pool(ids, 10);
    var weak = weakIds();
    var cta = due > 0 ? "Start today's session: " + daily.length + " questions (" + Math.min(due, 10) + " due)"
      : fresh > 0 ? "Start today's session: " + daily.length + " new questions"
      : "Nothing due. Practice " + daily.length + " anyway";

    var topics = TOPICS.map(function (t) {
      var tid = ids.filter(function (id) { return byId[id].t === t.k; });
      var cnt = { "new": 0, learn: 0, solid: 0, master: 0 };
      tid.forEach(function (id) { cnt[level(id)]++; });
      var td = tid.filter(isDue).length;
      var seg = ["master", "solid", "learn", "new"].map(function (k) {
        return cnt[k] ? '<span class="s-' + k + '" style="flex:' + cnt[k] + '" title="' + k + ": " + cnt[k] + '"></span>' : "";
      }).join("");
      return '<div class="topic"><div><div class="name">' + esc(t.n) + '</div><div class="sub">' + tid.length + " questions, " + td + " due</div></div>" +
        '<div class="bar-wrap"><div class="bar" role="img" aria-label="' + cnt.master + " mastered, " + cnt.solid + " solid, " + cnt.learn + " learning, " + cnt["new"] + ' new">' + seg + "</div></div>" +
        '<button class="btn small" data-a="topic" data-k="' + t.k + '">Practice</button></div>';
    }).join("");

    var log = P.sessions.length ? '<ol class="log" style="list-style:none">' + P.sessions.slice(-8).reverse().map(function (s) {
      var d = new Date(s.t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      var names = (s.k || []).map(function (k) { return topicName[k] || k; }).join(", ");
      return '<li class="' + (s.c === s.n ? "perfect" : "") + '"><span class="h">' + hash7(s.t) + '</span><span class="d">' + esc(d) + "</span><span>" + s.c + "/" + s.n + '</span><span class="t">' + esc(s.l) + (names ? ": " + esc(names) : "") + "</span></li>";
    }).join("") + "</ol>"
      : '<div class="empty">No sessions yet. Each session you finish is added here like a commit: a short hash, the date, your score and the topics covered.</div>';

    return header() +
      "<h1>ReviewRadar Phase 0 Quiz</h1>" +
      '<p class="lede">' + QUESTIONS.length + " questions on environments, the shell, Git, testing and CI. Missed questions come back sooner; ones you know come back after days, then weeks.</p>" +
      '<div class="strip"><div><div class="n">' + due + '</div><div class="l">due today</div></div>' +
      '<div><div class="n">' + streak() + '<small> days</small></div><div class="l">current streak</div></div>' +
      '<div><div class="n">' + solid + "<small>/" + QUESTIONS.length + '</small></div><div class="l">solid or mastered</div></div></div>' +
      '<div class="row"><button class="btn primary" data-a="daily">' + esc(cta) + "</button>" +
      '<button class="btn" data-a="weak"' + (weak.length ? "" : " disabled") + ">Weak spots (" + weak.length + ")</button>" +
      '<button class="btn" data-a="full">Full run (' + QUESTIONS.length + ")</button></div>" +
      '<section class="block"><h2>Topics</h2><div class="legend"><span><i class="s-master"></i>mastered</span><span><i class="s-solid"></i>solid</span><span><i class="s-learn"></i>learning</span><span><i style="border:1px solid var(--line)"></i>new</span></div>' + topics + "</section>" +
      '<section class="block"><h2>Session log</h2>' + log + "</section>" +
      '<div class="foot"><p>Questions come from <code>docs/QUIZ_SEED.md</code> in the repo, including the mistakes made during Phase 0. Progress is kept by question id, so adding questions later does not reset anything.</p>' +
      '<span><button class="link danger" data-a="reset">' + (resetArmed ? "Click again to erase all progress" : "Reset progress") + "</button></span></div>";
  }

  var resetArmed = false;

  function renderQuiz() {
    var cur = S.queue[S.i];
    var q = byId[cur.id];
    var ticks = "";
    for (var n = 0; n < S.total; n++) {
      var res = S.results[n];
      ticks += '<span class="' + (n === S.results.length && !cur.retry ? "cur" : res ? (res.ok ? "ok" : "no") : "") + '"></span>';
    }
    var label = cur.retry ? "Second try" : "Question " + (S.results.length + 1) + " of " + S.total;
    var body = "";
    if (!q.r) {
      body = '<div class="opts">' + S.opts.map(function (o, i) {
        var cls = "opt";
        if (S.answered) cls += o.ok ? " right" : i === S.ans ? " wrong" : " dim";
        return '<button class="' + cls + '" data-a="choose" data-i="' + i + '"' + (S.answered ? " disabled" : "") + '><span class="k">' + "ABCD"[i] + '</span><span class="tx">' + fmt(o.t) + "</span></button>";
      }).join("") + "</div>";
      if (S.answered) {
        body += '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Correct" : "Not quite") + "</div>" + (q.x ? "<p>" + fmt(q.x) + "</p>" : "") + "</div>" +
          '<div class="actions"><button class="btn primary" data-a="next">' + (S.i + 1 >= S.queue.length ? "Finish" : "Next") + "</button></div>";
      } else {
        body += '<div class="hint">press 1 to 4 to answer</div>';
      }
    } else {
      if (!S.revealed) {
        body = '<p style="color:var(--muted);margin:0 0 4px">Answer in your head or on paper, then check.</p><div class="actions"><button class="btn primary" data-a="reveal">Show answer</button></div><div class="hint">press Enter to reveal</div>';
      } else {
        body = '<div class="answerbox">' + fmt(q.a) + "</div>";
        if (!S.answered) body += '<div class="actions"><button class="btn primary" data-a="knew">I knew it</button><button class="btn" data-a="missed">I missed it</button></div>';
        else body += '<div class="feedback ' + (S.lastOk ? "ok" : "no") + '"><div class="v">' + (S.lastOk ? "Marked as known" : "Marked to review") + '</div></div><div class="actions"><button class="btn primary" data-a="next">' + (S.i + 1 >= S.queue.length ? "Finish" : "Next") + "</button></div>";
      }
    }
    return header() +
      '<div class="qhead"><button class="btn small" data-a="exit">Exit</button><span class="tag">' + esc(label) + " &middot; " + esc(S.label) + "</span></div>" +
      '<div class="ticks">' + ticks + "</div>" +
      '<div class="card"><div class="tags"><span class="tag">' + esc(topicName[q.t]) + "</span>" + (q.m ? '<span class="pill">You hit this in Phase 0</span>' : "") + "</div>" +
      '<h2 class="q">' + fmt(q.q) + "</h2>" + body + "</div>";
  }

  function renderSummary() {
    var c = S.results.filter(function (r) { return r.ok; }).length;
    var missed = S.results.filter(function (r) { return !r.ok; });
    var msg = c === S.results.length ? "Clean sweep." : c / S.results.length >= 0.7 ? "Solid. The misses are below." : "These come back tomorrow. Read the answers once now.";
    var list = missed.length ? '<ul class="missed">' + missed.map(function (r) {
      var q = byId[r.id];
      return '<li><div class="mq">' + fmt(q.q) + '</div><div class="ma">' + fmt(q.a) + "</div></li>";
    }).join("") + "</ul>" : "";
    return header() + "<h1>Session complete</h1>" +
      '<div class="score" style="margin-top:20px">' + c + "<small>/" + S.results.length + "</small></div>" +
      '<p class="lede">' + msg + "</p>" + list +
      '<div class="row" style="margin-top:28px">' + (missed.length ? '<button class="btn primary" data-a="retry">Retry the ' + missed.length + " missed</button>" : "") +
      '<button class="btn' + (missed.length ? "" : " primary") + '" data-a="home">Back to dashboard</button></div>';
  }

  function render() {
    app.innerHTML = view === "quiz" ? renderQuiz() : view === "summary" ? renderSummary() : renderHome();
  }

  /* ---------------- events ---------------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]");
    if (!b) return;
    var a = b.getAttribute("data-a");
    var ids = QUESTIONS.map(function (q) { return q.id; });
    if (a !== "reset" && resetArmed) { resetArmed = false; }
    if (a === "daily") startSession("Daily", pool(ids, 10));
    else if (a === "weak") startSession("Weak spots", weakIds().slice(0, 10));
    else if (a === "full") startSession("Full run", shuffle(ids));
    else if (a === "topic") { var k = b.getAttribute("data-k"); startSession(topicName[k], pool(ids.filter(function (id) { return byId[id].t === k; }), 10)); }
    else if (a === "choose") choose(Number(b.getAttribute("data-i")));
    else if (a === "reveal") { S.revealed = true; render(); }
    else if (a === "knew") answer(true);
    else if (a === "missed") answer(false);
    else if (a === "next") next();
    else if (a === "exit") { view = "home"; S = null; render(); }
    else if (a === "home") { view = "home"; S = null; render(); window.scrollTo(0, 0); }
    else if (a === "retry") { var m = S.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; }); startSession("Retry missed", m); }
    else if (a === "reset") {
      if (!resetArmed) { resetArmed = true; render(); }
      else { resetArmed = false; P = { v: 1, u: 0, items: {}, sessions: [] }; save(); render(); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (view !== "quiz" || !S || e.ctrlKey || e.metaKey || e.altKey) return;
    var q = byId[S.queue[S.i].id];
    var onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
    var i = "1234".indexOf(e.key);
    if (i < 0) i = "abcd".indexOf(e.key.toLowerCase());
    if (!q.r && !S.answered && i >= 0 && e.key.length === 1) { e.preventDefault(); choose(i); return; }
    if (e.key === "Enter" && !onButton) {
      e.preventDefault();
      if (q.r && !S.revealed) { S.revealed = true; render(); }
      else if (S.answered) next();
    }
  });

  /* ---------------- start ---------------- */
  var local = loadLocal();
  if (local) P = local;
  render();
  initStore();
})();
</script>
